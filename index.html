    console.error('Bundle unpack error:', err);

  }

above with @font-face rules pointing there. */\n</style>\n  <style>/* ============================================================\n   ASKLEPIOS \u2014 COLOR TOKENS\n   Source: Asklepios Corporate Design / PowerPoint-Vorlage 2025\n   Color scheme name in theme: \"ASKLEPIOS\"\n   ============================================================ */\n\n:root {\n  /* --- Brand core ------------------------------------------------ */\n  --ask-petrol: #007377;          /* Prim\u00e4rfarbe  \u00b7 RGB 0 115 119  */\n  --ask-magenta: #bb16a3;         /* Sekund\u00e4rfarbe \u00b7 RGB 187 22 163 */\n\n  /* --- Accent row (Designfarben) -------------------------------- */\n  --ask-navy: #254a5d;            /* dunkles Petrol \u00b7 RGB 37 74 93  */\n  --ask-violet: #6558b1;          /* RGB 101 88 177 */\n  --ask-pink: #ff417d;            /* RGB 255 65 125 */\n  --ask-mint: #64eb9b;            /* RGB 100 235 155 */\n  --ask-gold: #ffb81c;            /* RGB 255 184 28  */\n  --ask-link-visited: #56b093;    /* besuchter Link */\n\n  /* --- Neutrals -------------------------------------------------- */\n  --ask-black: #000000;\n  --ask-white: #ffffff;\n  --ask-ink: #14191a;             /* near-black text on light       */\n  --ask-grey-900: #1f2a2b;\n  --ask-grey-700: #46595b;\n  --ask-grey-500: #7a8d8e;\n  --ask-grey-300: #c3cfd0;\n  --ask-grey-200: #dde5e5;\n  --ask-grey-100: #eef2f2;\n  --ask-grey-050: #f6f8f8;\n\n  /* --- Tints (75 / 50 / 25 % colour strength over white) --------\n     Mirrors the 75/50/25 % swatch ladder in the corporate palette. */\n  --ask-petrol-75: color-mix(in srgb, var(--ask-petrol) 75%, #fff);\n  --ask-petrol-50: color-mix(in srgb, var(--ask-petrol) 50%, #fff);\n  --ask-petrol-25: color-mix(in srgb, var(--ask-petrol) 25%, #fff);\n\n  --ask-magenta-75: color-mix(in srgb, var(--ask-magenta) 75%, #fff);\n  --ask-magenta-50: color-mix(in srgb, var(--ask-magenta) 50%, #fff);\n  --ask-magenta-25: color-mix(in srgb, var(--ask-magenta) 25%, #fff);\n\n  --ask-navy-75: color-mix(in srgb, var(--ask-navy) 75%, #fff);\n  --ask-navy-50: color-mix(in srgb, var(--ask-navy) 50%, #fff);\n  --ask-navy-25: color-mix(in srgb, var(--ask-navy) 25%, #fff);\n\n  --ask-violet-50: color-mix(in srgb, var(--ask-violet) 50%, #fff);\n  --ask-pink-50: color-mix(in srgb, var(--ask-pink) 50%, #fff);\n  --ask-mint-50: color-mix(in srgb, var(--ask-mint) 50%, #fff);\n  --ask-gold-50: color-mix(in srgb, var(--ask-gold) 50%, #fff);\n\n  /* Petrol shade used for hover / pressed (darker, toward navy) */\n  --ask-petrol-700: #005a5d;\n  --ask-petrol-800: #00484b;\n  --ask-magenta-700: #9a1187;\n\n  /* ============================================================\n     SEMANTIC ALIASES \u2014 reference these in product UI\n     ============================================================ */\n\n  /* Brand */\n  --color-brand: var(--ask-petrol);\n  --color-brand-secondary: var(--ask-magenta);\n  --color-accent: var(--ask-magenta);\n\n  /* Surfaces */\n  --surface-page: var(--ask-white);\n  --surface-card: var(--ask-white);\n  --surface-muted: var(--ask-grey-050);\n  --surface-sunken: var(--ask-grey-100);\n  --surface-inverse: var(--ask-petrol);     /* dark / brand sections */\n  --surface-inverse-deep: var(--ask-navy);\n\n  /* Text */\n  --text-strong: var(--ask-ink);\n  --text-body: var(--ask-grey-900);\n  --text-muted: var(--ask-grey-700);\n  --text-subtle: var(--ask-grey-500);\n  --text-brand: var(--ask-petrol);\n  --text-on-brand: var(--ask-white);\n  --text-on-dark: var(--ask-white);\n\n  /* Lines & borders */\n  --border-subtle: var(--ask-grey-200);\n  --border-default: var(--ask-grey-300);\n  --border-strong: var(--ask-petrol);\n\n  /* Interactive */\n  --color-link: var(--ask-petrol);\n  --color-link-visited: var(--ask-link-visited);\n  --focus-ring: var(--ask-petrol);\n\n  /* Status (built from the brand accent row) */\n  --status-success: #1f8a5b;\n  --status-success-surface: #e4f6ec;\n  --status-warning: var(--ask-gold);\n  --status-warning-surface: #fff4d9;\n  --status-danger: var(--ask-pink);\n  --status-danger-surface: #ffe4ec;\n  --status-info: var(--ask-petrol);\n  --status-info-surface: #e0f0f0;\n}\n</style>\n  <style>/* ============================================================\n   ASKLEPIOS \u2014 TYPOGRAPHY TOKENS\n   Hausschrift \"Inter\". Body copy is left-aligned; numbers may be\n   right-aligned; short boxed labels may be centred.\n   ============================================================ */\n\n:root {\n  /* --- Families ------------------------------------------------- */\n  --font-sans: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;\n  --font-display: 'Inter', -apple-system, 'Segoe UI', sans-serif;\n  --font-mono: ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace;\n\n  /* --- Weights --------------------------------------------------\n     @kind font */\n  --fw-regular: 400;   /* @kind font */\n  --fw-medium: 500;    /* @kind font */\n  --fw-semibold: 600;  /* @kind font */\n  --fw-bold: 700;      /* @kind font */\n  --fw-extrabold: 800; /* @kind font */\n\n  /* --- Type scale (rem, 16px base) -----------------------------\n     Maps to the PowerPoint Textebenen (text levels) + display use. */\n  --fs-display: 4.5rem;     /* 72 \u2014 slide title / hero            */\n  --fs-h1: 3rem;            /* 48 \u2014 page H1                       */\n  --fs-h2: 2.25rem;         /* 36 \u2014 section heading               */\n  --fs-h3: 1.625rem;        /* 26 \u2014 subsection (Ebene 1)          */\n  --fs-h4: 1.25rem;         /* 20 \u2014 card title (Ebene 2)          */\n  --fs-lg: 1.125rem;        /* 18 \u2014 lead body                     */\n  --fs-body: 1rem;          /* 16 \u2014 body                          */\n  --fs-sm: 0.875rem;        /* 14 \u2014 secondary                     */\n  --fs-xs: 0.75rem;         /* 12 \u2014 caption / footer              */\n\n  /* --- Line heights --------------------------------------------\n     @kind other */\n  --lh-tight: 1.1;     /* @kind other */\n  --lh-snug: 1.25;     /* @kind other */\n  --lh-normal: 1.5;    /* @kind other */\n  --lh-relaxed: 1.65;  /* @kind other */\n\n  /* --- Letter spacing ------------------------------------------\n     @kind other */\n  --ls-tight: -0.02em; /* @kind other */\n  --ls-snug: -0.01em;  /* @kind other */\n  --ls-normal: 0;      /* @kind other */\n  --ls-wide: 0.04em;   /* @kind other */\n  --ls-caps: 0.08em;   /* @kind other */\n\n  /* --- Semantic aliases ---------------------------------------- */\n  --text-display-weight: var(--fw-bold);\n  --text-heading-weight: var(--fw-bold);\n  --text-body-weight: var(--fw-regular);\n}\n</style>\n  <style>/* ============================================================\n   ASKLEPIOS \u2014 SPACING, RADII, ELEVATION, MOTION\n   Brand rule: graphic shapes (St\u00f6rer / Hinweisk\u00e4sten) carry NO\n   shadow. Shadows below are reserved for product UI surfaces only.\n   ============================================================ */\n\n:root {\n  /* --- Spacing scale (4px base) -------------------------------- */\n  --space-0: 0;\n  --space-1: 0.25rem;   /* 4  */\n  --space-2: 0.5rem;    /* 8  */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.5rem;    /* 24 */\n  --space-6: 2rem;      /* 32 */\n  --space-7: 2.5rem;    /* 40 */\n  --space-8: 3rem;      /* 48 */\n  --space-9: 4rem;      /* 64 */\n  --space-10: 5rem;     /* 80 */\n  --space-12: 7.5rem;   /* 120 */\n\n  /* --- Radii ---------------------------------------------------- */\n  --radius-xs: 4px;\n  --radius-sm: 6px;\n  --radius-md: 10px;\n  --radius-lg: 16px;\n  --radius-xl: 24px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* --- Borders -------------------------------------------------- */\n  --border-width: 1px;          /* @kind other */\n  --border-width-strong: 2px;   /* @kind other */\n\n  /* --- Elevation (product UI only \u2014 never on brand shapes) ------ */\n  --shadow-none: none;\n  --shadow-sm: 0 1px 2px rgba(20, 25, 26, 0.06),\n               0 1px 1px rgba(20, 25, 26, 0.04);\n  --shadow-md: 0 4px 12px rgba(20, 25, 26, 0.08),\n               0 2px 4px rgba(20, 25, 26, 0.05);\n  --shadow-lg: 0 12px 32px rgba(20, 25, 26, 0.12),\n               0 4px 10px rgba(20, 25, 26, 0.06);\n  --shadow-focus: 0 0 0 3px color-mix(in srgb, var(--ask-petrol) 35%, transparent);\n\n  /* --- Motion --------------------------------------------------- */\n  --ease-standard: cubic-bezier(0.2, 0, 0.1, 1);   /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);       /* @kind other */\n  --dur-fast: 120ms;   /* @kind other */\n  --dur-base: 200ms;   /* @kind other */\n  --dur-slow: 320ms;   /* @kind other */\n\n  /* --- Brand graphic motif ------------------------------------- */\n  --stoerer-tilt: -7deg;        /* @kind other */\n}\n</style>\n  <style>/* ============================================================\n   ASKLEPIOS \u2014 BASE / FOUNDATION\n   Element defaults that apply the Hausschrift and brand colours.\n   ============================================================ */\n\n:root {\n  color-scheme: light;\n}\n\nbody {\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-normal);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Headings \u2014 Inter Bold, tight tracking, left aligned */\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  color: var(--text-strong);\n  letter-spacing: var(--ls-tight);\n  line-height: var(--lh-tight);\n  margin: 0;\n  text-wrap: balance;\n}\nh1 { font-size: var(--fs-h1); }\nh2 { font-size: var(--fs-h2); }\nh3 { font-size: var(--fs-h3); letter-spacing: var(--ls-snug); }\nh4 { font-size: var(--fs-h4); letter-spacing: var(--ls-snug); }\n\np { margin: 0; text-wrap: pretty; }\n\na {\n  color: var(--color-link);\n  text-underline-offset: 2px;\n  text-decoration-thickness: 1px;\n}\na:visited { color: var(--color-link-visited); }\n\n/* Numerals can be set tabular & right-aligned per brand guidance */\n.ask-num {\n  font-variant-numeric: tabular-nums;\n  text-align: right;\n}\n\n::selection {\n  background: color-mix(in srgb, var(--ask-petrol) 22%, #fff);\n  color: var(--ask-petrol-800);\n}\n</style>\n  <style>/* ============================================================\n   ASKLEPIOS DESIGN SYSTEM \u2014 global entry point\n   Consumers link THIS file. It only @imports the token layers.\n   ============================================================ */\n\n/* ============================================================\n   ASKLEPIOS \u2014 FONTS\n   Hausschrift: \"Inter\" (Regular + Bold), the official Asklepios\n   brand typeface. Loaded here from Google Fonts.\n   ============================================================ */\n\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b49d0774-e002-47ba-abc3-d2daae226bb8\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"2b684907-40b9-45c6-bdb9-d59389709c59\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"2aca257d-29a6-4f49-88f8-6d94aa9a0cfd\") format('woff2');\n  unicode-range: U+1F00-1FFF;\n}\n/* greek */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e4299e31-4c43-4d77-88ae-91f632a0ddd7\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font- 9, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Inter is the genuine Asklepios house font \u2014 not a substitution.\n   If you self-host the licensed binaries, drop them in assets/fonts/\n   and replace the @import above with @font-face rules pointing there. */\n\n/* ============================================================\n   ASKLEPIOS \u2014 COLOR TOKENS\n   Source: Asklepios Corporate Design / PowerPoint-Vorlage 2025\n   Color scheme name in theme: \"ASKLEPIOS\"\n   ============================================================ */\n\n:root {\n  /* --- Brand core ------------------------------------------------ */\n  --ask-petrol: #007377;          /* Prim\u00e4rfarbe  \u00b7 RGB 0 115 119  */\n  --ask-magenta: #bb16a3;         /* Sekund\u00e4rfarbe \u00b7 RGB 187 22 163 */\n\n  /* --- Accent row (Designfarben) -------------------------------- */\n  --ask-navy: #254a5d;            /* dunkles Petrol \u00b7 RGB 37 74 93  */\n  --ask-violet: #6558b1;          /* RGB 101 88 177 */\n  --ask-pink: #ff417d;            /* RGB 255 65 125 */\n  --ask-mint: #64eb9b;            /* RGB 100 235 155 */\n  --ask-gold: #ffb81c;            /* RGB 255 184 28  */\n  --ask-link-visited: #56b093;    /* besuchter Link */\n\n  /* --- Neutrals -------------------------------------------------- */\n  --ask-black: #000000;\n  --ask-white: #ffffff;\n  --ask-ink: #14191a;             /* near-black text on light       */\n  --ask-grey-900: #1f2a2b;\n  --ask-grey-700: #46595b;\n  --ask-grey-500: #7a8d8e;\n  --ask-grey-300: #c3cfd0;\n  --ask-grey-200: #dde5e5;\n  --ask-grey-100: #eef2f2;\n  --ask-grey-050: #f6f8f8;\n\n  /* --- Tints (75 / 50 / 25 % colour strength over white) --------\n     Mirrors the 75/50/25 % swatch ladder in the corporate palette. */\n  --ask-petrol-75: color-mix(in srgb, var(--ask-petrol) 75%, #fff);\n  --ask-petrol-50: color-mix(in srgb, var(--ask-petrol) 50%, #fff);\n  --ask-petrol-25: color-mix(in srgb, var(--ask-petrol) 25%, #fff);\n\n  --ask-magenta-75: color-mix(in srgb, var(--ask-magenta) 75%, #fff);\n  --ask-magenta-50: color-mix(in srgb, var(--ask-magenta) 50%, #fff);\n  --ask-magenta-25: color-mix(in srgb, var(--ask-magenta) 25%, #fff);\n\n  --ask-navy-75: color-mix(in srgb, var(--ask-navy) 75%, #fff);\n  --ask-navy-50: color-mix(in srgb, var(--ask-navy) 50%, #fff);\n  --ask-navy-25: color-mix(in srgb, var(--ask-navy) 25%, #fff);\n\n  --ask-violet-50: color-mix(in srgb, var(--ask-violet) 50%, #fff);\n  --ask-pink-50: color-mix(in srgb, var(--ask-pink) 50%, #fff);\n  --ask-mint-50: color-mix(in srgb, var(--ask-mint) 50%, #fff);\n  --ask-gold-50: color-mix(in srgb, var(--ask-gold) 50%, #fff);\n\n  /* Petrol shade used for hover / pressed (darker, toward navy) */\n  --ask-petrol-700: #005a5d;\n  --ask-petrol-800: #00484b;\n  --ask-magenta-700: #9a1187;\n\n  /* ============================================================\n     SEMANTIC ALIASES \u2014 reference these in product UI\n     ============================================================ */\n\n  /* Brand */\n  --color-brand: var(--ask-petrol);\n  --color-brand-secondary: var(--ask-magenta);\n  --color-accent: var(--ask-magenta);\n\n  /* Surfaces */\n  --surface-page: var(--ask-white);\n  --surface-card: var(--ask-white);\n  --surface-muted: var(--ask-grey-050);\n  --surface-sunken: var(--ask-grey-100);\n  --surface-inverse: var(--ask-petrol);     /* dark / brand sections */\n  --surface-inverse-deep: var(--ask-navy);\n\n  /* Text */\n  --text-strong: var(--ask-ink);\n  --text-body: var(--ask-grey-900);\n  --text-muted: var(--ask-grey-700);\n  --text-subtle: var(--ask-grey-500);\n  --text-brand: var(--ask-petrol);\n  --text-on-brand: var(--ask-white);\n  --text-on-dark: var(--ask-white);\n\n  /* Lines & borders */\n  --border-subtle: var(--ask-grey-200);\n  --border-default: var(--ask-grey-300);\n  --border-strong: var(--ask-petrol);\n\n  /* Interactive */\n  --color-link: var(--ask-petrol);\n  --color-link-visited: var(--ask-link-visited);\n  --focus-ring: var(--ask-petrol);\n\n  /* Status (built from the brand accent row) */\n  --status-success: #1f8a5b;\n  --status-success-surface: #e4f6ec;\n  --status-warning: var(--ask-gold);\n  --status-warning-surface: #fff4d9;\n  --status-danger: var(--ask-pink);\n  --status-danger-surface: #ffe4ec;\n  --status-info: var(--ask-petrol);\n  --status-info-surface: #e0f0f0;\n}\n\n/* ============================================================\n   ASKLEPIOS \u2014 TYPOGRAPHY TOKENS\n   Hausschrift \"Inter\". Body copy is left-aligned; numbers may be\n   right-aligned; short boxed labels may be centred.\n   ============================================================ */\n\n:root {\n  /* --- Families ------------------------------------------------- */\n  --font-sans: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;\n  --font-display: 'Inter', -apple-system, 'Segoe UI', sans-serif;\n  --font-mono: ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace;\n\n  /* --- Weights --------------------------------------------------\n     @kind font */\n  --fw-regular: 400;   /* @kind font */\n  --fw-medium: 500;    /* @kind font */\n  --fw-semibold: 600;  /* @kind font */\n  --fw-bold: 700;      /* @kind font */\n  --fw-extrabold: 800; /* @kind font */\n\n  /* --- Type scale (rem, 16px base) -----------------------------\n     Maps to the PowerPoint Textebenen (text levels) + display use. */\n  --fs-display: 4.5rem;     /* 72 \u2014 slide title / hero            */\n  --fs-h1: 3rem;            /* 48 \u2014 page H1                       */\n  --fs-h2: 2.25rem;         /* 36 \u2014 section heading               */\n  --fs-h3: 1.625rem;        /* 26 \u2014 subsection (Ebene 1)          */\n  --fs-h4: 1.25rem;         /* 20 \u2014 card title (Ebene 2)          */\n  --fs-lg: 1.125rem;        /* 18 \u2014 lead body                     */\n  --fs-body: 1rem;          /* 16 \u2014 body                          */\n  --fs-sm: 0.875rem;        /* 14 \u2014 secondary                     */\n  --fs-xs: 0.75rem;         /* 12 \u2014 caption / footer              */\n\n  /* --- Line heights --------------------------------------------\n     @kind other */\n  --lh-tight: 1.1;     /* @kind other */\n  --lh-snug: 1.25;     /* @kind other */\n  --lh-normal: 1.5;    /* @kind other */\n  --lh-relaxed: 1.65;  /* @kind other */\n\n  /* --- Letter spacing ------------------------------------------\n     @kind other */\n  --ls-tight: -0.02em; /* @kind other */\n  --ls-snug: -0.01em;  /* @kind other */\n  --ls-normal: 0;      /* @kind other */\n  --ls-wide: 0.04em;   /* @kind other */\n  --ls-caps: 0.08em;   /* @kind other */\n\n  /* --- Semantic aliases ---------------------------------------- */\n  --text-display-weight: var(--fw-bold);\n  --text-heading-weight: var(--fw-bold);\n  --text-body-weight: var(--fw-regular);\n}\n\n/* ============================================================\n   ASKLEPIOS \u2014 SPACING, RADII, ELEVATION, MOTION\n   Brand rule: graphic shapes (St\u00f6rer / Hinweisk\u00e4sten) carry NO\n   shadow. Shadows below are reserved for product UI surfaces only.\n   ============================================================ */\n\n:root {\n  /* --- Spacing scale (4px base) -------------------------------- */\n  --space-0: 0;\n  --space-1: 0.25rem;   /* 4  */\n  --space-2: 0.5rem;    /* 8  */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.5rem;    /* 24 */\n  --space-6: 2rem;      /* 32 */\n  --space-7: 2.5rem;    /* 40 */\n  --space-8: 3rem;      /* 48 */\n  --space-9: 4rem;      /* 64 */\n  --space-10: 5rem;     /* 80 */\n  --space-12: 7.5rem;   /* 120 */\n\n  /* --- Radii ---------------------------------------------------- */\n  --radius-xs: 4px;\n  --radius-sm: 6px;\n  --radius-md: 10px;\n  --radius-lg: 16px;\n  --radius-xl: 24px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* --- Borders -------------------------------------------------- */\n  --border-width: 1px;          /* @kind other */\n  --border-width-strong: 2px;   /* @kind other */\n\n  /* --- Elevation (product UI only \u2014 never on brand shapes) ------ */\n  --shadow-none: none;\n  --shadow-sm: 0 1px 2px rgba(20, 25, 26, 0.06),\n               0 1px 1px rgba(20, 25, 26, 0.04);\n  --shadow-md: 0 4px 12px rgba(20, 25, 26, 0.08),\n               0 2px 4px rgba(20, 25, 26, 0.05);\n  --shadow-lg: 0 12px 32px rgba(20, 25, 26, 0.12),\n               0 4px 10px rgba(20, 25, 26, 0.06);\n  --shadow-focus: 0 0 0 3px color-mix(in srgb, var(--ask-petrol) 35%, transparent);\n\n  /* --- Motion --------------------------------------------------- */\n  --ease-standard: cubic-bezier(0.2, 0, 0.1, 1);   /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);       /* @kind other */\n  --dur-fast: 120ms;   /* @kind other */\n  --dur-base: 200ms;   /* @kind other */\n  --dur-slow: 320ms;   /* @kind other */\n\n  /* --- Brand graphic motif ------------------------------------- */\n  --stoerer-tilt: -7deg;        /* @kind other */\n}\n\n/* ============================================================\n   ASKLEPIOS \u2014 BASE / FOUNDATION\n   Element defaults that apply the Hausschrift and brand colours.\n   ============================================================ */\n\n:root {\n  color-scheme: light;\n}\n\nbody {\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-normal);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Headings \u2014 Inter Bold, tight tracking, left aligned */\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  color: var(--text-strong);\n  letter-spacing: var(--ls-tight);\n  line-height: var(--lh-tight);\n  margin: 0;\n  text-wrap: balance;\n}\nh1 { font-size: var(--fs-h1); }\nh2 { font-size: var(--fs-h2); }\nh3 { font-size: var(--fs-h3); letter-spacing: v a >>> 15, 1 | a);\n      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;\n      return ((t ^ t >>> 14) >>> 0) / 4294967296;\n    };\n  }\n  // style a tile by role \u2192 size hierarchy; NO clamp/fixed height so nothing is ever cut off\n  styleCard(v, role){\n    const S = { big:{ b:154, t:21, s:19, sum:true }, mid:{ b:116, t:17, s:16, sum:true }, stack:{ b:76, t:15, s:15, sum:false } }[role];\n    return {\n      ...v,\n      cardStyle: 'flex:1 1 auto;display:flex;flex-direction:column;overflow:hidden;background:#fff;border:1px solid #dde5e5;border-radius:13px;text-decoration:none;color:inherit;',\n      thumbStyle: 'flex:none;display:flex;flex-direction:column;justify-content:space-between;height:' + S.b + 'px;padding:' + (role === 'stack' ? '12px 14px' : '14px') + ';background:' + v.catColor + ';',\n      thumbSrcStyle: 'font-size:' + S.s + 'px;font-weight:800;letter-spacing:-.2px;color:#ffffff;',\n      titleStyle: 'margin:0;font-size:' + S.t + 'px;line-height:1.3;font-weight:700;color:#14191a;letter-spacing:-.2px;',\n      showSummary: S.sum,\n    };\n  }\n  buildRows(items){\n    const rand = this.mulberry(20260618);   // fixed seed \u2192 deterministic, stable on re-render\n    const R = (lo, hi) => lo + rand() * (hi - lo);\n    // shapes keyed by their tile-count silhouette; a shape may not recur within the last two rows\n    const mid = (w) => ({ w, tiles: [ 'mid' ] });\n    const big = (w) => ({ w, tiles: [ 'big' ] });\n    const st  = () => ({ w: 1, tiles: [ 'stack', 'stack' ] });\n    const lone = () => (rand() < 0.5 ? big(R(1.35, 1.95)) : mid(R(1.15, 1.65)));\n    const S = {\n      t:  () => [ mid(R(0.78, 1.45)), mid(R(0.78, 1.45)), mid(1) ],   // 1:1:1\n      sL: () => [ st(), lone() ],                                     // 2:1 (stack left)\n      sR: () => [ lone(), st() ],                                     // 1:2 (stack right)\n      d:  () => (rand() < 0.5 ? [ big(R(1.1, 1.7)), mid(1) ] : [ mid(R(0.8, 1.3)), big(1) ]),  // 1:1\n    };\n    const keys = [ 't', 'sL', 'sR', 'd' ];\n    const rows = []; let i = 0; const recent = [];\n    while (i < items.length){\n      const rem = items.length - i;\n      let key, cells;\n      if (rem === 1){ key = 'b'; cells = [ big(1) ]; }\n      else if (rem === 2){ key = 'd'; cells = S.d(); }\n      else {\n        let avail = keys.filter(k => !recent.includes(k));\n        if (!avail.length) avail = keys;\n        key = avail[Math.floor(rand() * avail.length)];\n        cells = S[key]();\n      }\n      let k = i;\n      const outCells = cells.map(cell => ({\n        wrapStyle: 'flex:' + cell.w.toFixed(3) + ' 1 0;min-width:0;display:flex;flex-direction:column;gap:18px;',\n        items: cell.tiles.map(role => this.styleCard(items[k++], role)),\n      }));\n      i = k;\n      rows.push({ style: 'display:flex;gap:18px;align-items:stretch;', cells: outCells });\n      recent.push(key); if (recent.length > 2) recent.shift();\n    }\n    return rows;\n  }\n\n  // ---- chip / row styles ----\n  chipStyle(active, color){\n    const base = 'display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;border:1px solid ';\n    return active\n      ? base + (color||'#007377') + ';background:' + (color||'#007377') + ';color:#fff;'\n      : base + '#dde5e5;background:#fff;color:#46595b;';\n  }\n  chipDot(active, color){\n    const c = active ? '#ffffff' : (color || '#007377');\n    return 'display:inline-block;width:8px;height:8px;border-radius:3px;background:' + c + ';';\n  }\n  chipCount(active){\n    return 'font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;background:' + (active ? 'rgba(255,255,255,.22)' : '#eef2f2') + ';color:' + (active ? '#fff' : '#7a8d8e') + ';';\n  }\n  rowStyle(active){\n    const base = 'display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:none;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;background:';\n    return active ? base + '#e0f0f0;color:#005a5d;' : base + 'transparent;color:#46595b;';\n  }\n  rowDot(color){ return 'display:inline-block;width:9px;height:9px;border-radius:3px;background:' + color + ';flex:none;'; }\n  rowCount(active){ return 'font-size:11px;font-weight:700;color:' + (active ? '#007377' : '#a9b8b9') + ';'; }\n  segStyle(active){\n    const base = 'border:none;border-radius:8px;padding:0 13px;height:32px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;background:';\n    return active ? base + '#007377;color:#fff;' : base + 'transparent;color:#46595b;';\n  }\n\n  // ---- live fetch (best effort, user-initiated) ----\n  async tryLive(){\n    if (this.state.liveBusy) return;\n    this.setState({ liveBusy: true });\n    try {\n      const q = 'https://news.google.com/rss/search?q=Asklepios%20OR%20UKE%20Krankenhaus%20Hamburg&hl=de&gl=DE&ceid=DE:de';\n      const url = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(q);\n      const ctrl = new AbortController();\n      const to = setTimeout(()=>ctrl.abort(), 8000);\n      const res = await fetch(url, { signal: ctrl.signal });\n      clearTimeout(to);\n      const txt = await res.text();\n      const xml = new DOMParser().parseFromString(txt, 'text/xml');\n      const nodes = Array.from(xml.querySelectorAll('item')).slice(0, 6);\n      const fresh = nodes.map((el, i) => {\n        const t = (el.querySelector('title')||{}).textContent || 'Ohne Titel';\n        const link = (el.querySelector('link')||{}).textContent || '#';\n        const pub = (el.querySelector('pubDate')||{}).textContent;\n        const src = (el.querySelector('source')||{}).textContent || 'Google News';\n        const desc = ((el.querySelector('description')||{}).textContent || '').replace(/<[^>]+>/g,'').trim().slice(0, 160);\n        return { id:'live'+i, feed:'radar', source:src, category:'Wettbewerbe
