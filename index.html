<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bundled Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>

    </g>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const blobContents = {};

      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');

      }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        if (blobContents[s.src] !== undefined) {
          s.textContent = blobContents[s.src];
        } else {
          try {
            const r = await fetch(s.src);
            s.textContent = await r.text();
          } catch (e) {
            console.warn('[bundler] fetch failed for babel script, skipping:', s.src, e);
          }
        }
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

above with @font-face rules pointing there. */\n</style>\n  <style>/* ============================================================\n   ASKLEPIOS \u2014 COLOR TOKENS\n   Source: Asklepios Corporate Design / PowerPoint-Vorlage 2025\n   Color scheme name in theme: \"ASKLEPIOS\"\n   ============================================================ */\n\n:root {\n  /* --- Brand core ------------------------------------------------ */\n  --ask-petrol: #007377;          /* Prim\u00e4rfarbe  \u00b7 RGB 0 115 119  */\n  --ask-magenta: #bb16a3;         /* Sekund\u00e4rfarbe \u00b7 RGB 187 22 163 */\n\n  /* --- Accent row (Designfarben) -------------------------------- */\n  --ask-navy: #254a5d;            /* dunkles Petrol \u00b7 RGB 37 74 93  */\n  --ask-violet: #6558b1;          /* RGB 101 88 177 */\n  --ask-pink: #ff417d;            /* RGB 255 65 125 */\n  --ask-mint: #64eb9b;            /* RGB 100 235 155 */\n  --ask-gold: #ffb81c;            /* RGB 255 184 28  */\n  --ask-link-visited: #56b093;    /* besuchter Link */\n\n  /* --- Neutrals -------------------------------------------------- */\n  --ask-black: #000000;\n  --ask-white: #ffffff;\n  --ask-ink: #14191a;             /* near-black text on light       */\n  --ask-grey-900: #1f2a2b;\n  --ask-grey-700: #46595b;\n  --ask-grey-500: #7a8d8e;\n  --ask-grey-300: #c3cfd0;\n  --ask-grey-200: #dde5e5;\n  --ask-grey-100: #eef2f2;\n  --ask-grey-050: #f6f8f8;\n\n  /* --- Tints (75 / 50 / 25 % colour strength over white) --------\n     Mirrors the 75/50/25 % swatch ladder in the corporate palette. */\n  --ask-petrol-75: color-mix(in srgb, var(--ask-petrol) 75%, #fff);\n  --ask-petrol-50: color-mix(in srgb, var(--ask-petrol) 50%, #fff);\n  --ask-petrol-25: color-mix(in srgb, var(--ask-petrol) 25%, #fff);\n\n  --ask-magenta-75: color-mix(in srgb, var(--ask-magenta) 75%, #fff);\n  --ask-magenta-50: color-mix(in srgb, var(--ask-magenta) 50%, #fff);\n  --ask-magenta-25: color-mix(in srgb, var(--ask-magenta) 25%, #fff);\n\n  --ask-navy-75: color-mix(in srgb, var(--ask-navy) 75%, #fff);\n  --ask-navy-50: color-mix(in srgb, var(--ask-navy) 50%, #fff);\n  --ask-navy-25: color-mix(in srgb, var(--ask-navy) 25%, #fff);\n\n  --ask-violet-50: color-mix(in srgb, var(--ask-violet) 50%, #fff);\n  --ask-pink-50: color-mix(in srgb, var(--ask-pink) 50%, #fff);\n  --ask-mint-50: color-mix(in srgb, var(--ask-mint) 50%, #fff);\n  --ask-gold-50: color-mix(in srgb, var(--ask-gold) 50%, #fff);\n\n  /* Petrol shade used for hover / pressed (darker, toward navy) */\n  --ask-petrol-700: #005a5d;\n  --ask-petrol-800: #00484b;\n  --ask-magenta-700: #9a1187;\n\n  /* ============================================================\n     SEMANTIC ALIASES \u2014 reference these in product UI\n     ============================================================ */\n\n  /* Brand */\n  --color-brand: var(--ask-petrol);\n  --color-brand-secondary: var(--ask-magenta);\n  --color-accent: var(--ask-magenta);\n\n  /* Surfaces */\n  --surface-page: var(--ask-white);\n  --surface-card: var(--ask-white);\n  --surface-muted: var(--ask-grey-050);\n  --surface-sunken: var(--ask-grey-100);\n  --surface-inverse: var(--ask-petrol);     /* dark / brand sections */\n  --surface-inverse-deep: var(--ask-navy);\n\n  /* Text */\n  --text-strong: var(--ask-ink);\n  --text-body: var(--ask-grey-900);\n  --text-muted: var(--ask-grey-700);\n  --text-subtle: var(--ask-grey-500);\n  --text-brand: var(--ask-petrol);\n  --text-on-brand: var(--ask-white);\n  --text-on-dark: var(--ask-white);\n\n  /* Lines & borders */\n  --border-subtle: var(--ask-grey-200);\n  --border-default: var(--ask-grey-300);\n  --border-strong: var(--ask-petrol);\n\n  /* Interactive */\n  --color-link: var(--ask-petrol);\n  --color-link-visited: var(--ask-link-visited);\n  --focus-ring: var(--ask-petrol);\n\n  /* Status (built from the brand accent row) */\n  --status-success: #1f8a5b;\n  --status-success-surface: #e4f6ec;\n  --status-warning: var(--ask-gold);\n  --status-warning-surface: #fff4d9;\n  --status-danger: var(--ask-pink);\n  --status-danger-surface: #ffe4ec;\n  --status-info: var(--ask-petrol);\n  --status-info-surface: #e0f0f0;\n}\n</style>\n  <style>/* ============================================================\n   ASKLEPIOS \u2014 TYPOGRAPHY TOKENS\n   Hausschrift \"Inter\". Body copy is left-aligned; numbers may be\n   right-aligned; short boxed labels may be centred.\n   ============================================================ */\n\n:root {\n  /* --- Families ------------------------------------------------- */\n  --font-sans: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;\n  --font-display: 'Inter', -apple-system, 'Segoe UI', sans-serif;\n  --font-mono: ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace;\n\n  /* --- Weights --------------------------------------------------\n     @kind font */\n  --fw-regular: 400;   /* @kind font */\n  --fw-medium: 500;    /* @kind font */\n  --fw-semibold: 600;  /* @kind font */\n  --fw-bold: 700;      /* @kind font */\n  --fw-extrabold: 800; /* @kind font */\n\n  /* --- Type scale (rem, 16px base) -----------------------------\n     Maps to the PowerPoint Textebenen (text levels) + display use. */\n  --fs-display: 4.5rem;     /* 72 \u2014 slide title / hero            */\n  --fs-h1: 3rem;            /* 48 \u2014 page H1                       */\n  --fs-h2: 2.25rem;         /* 36 \u2014 section heading               */\n  --fs-h3: 1.625rem;        /* 26 \u2014 subsection (Ebene 1)          */\n  --fs-h4: 1.25rem;         /* 20 \u2014 card title (Ebene 2)          */\n  --fs-lg: 1.125rem;        /* 18 \u2014 lead body                     */\n  --fs-body: 1rem;          /* 16 \u2014 body                          */\n  --fs-sm: 0.875rem;        /* 14 \u2014 secondary                     */\n  --fs-xs: 0.75rem;         /* 12 \u2014 caption / footer              */\n\n  /* --- Line heights --------------------------------------------\n     @kind other */\n  --lh-tight: 1.1;     /* @kind other */\n  --lh-snug: 1.25;     /* @kind other */\n  --lh-normal: 1.5;    /* @kind other */\n  --lh-relaxed: 1.65;  /* @kind other */\n\n  /* --- Letter spacing ------------------------------------------\n     @kind other */\n  --ls-tight: -0.02em; /* @kind other */\n  --ls-snug: -0.01em;  /* @kind other */\n  --ls-normal: 0;      /* @kind other */\n  --ls-wide: 0.04em;   /* @kind other */\n  --ls-caps: 0.08em;   /* @kind other */\n\n  /* --- Semantic aliases ---------------------------------------- */\n  --text-display-weight: var(--fw-bold);\n  --text-heading-weight: var(--fw-bold);\n  --text-body-weight: var(--fw-regular);\n}\n</style>\n  <style>/* ============================================================\n   ASKLEPIOS \u2014 SPACING, RADII, ELEVATION, MOTION\n   Brand rule: graphic shapes (St\u00f6rer / Hinweisk\u00e4sten) carry NO\n   shadow. Shadows below are reserved for product UI surfaces only.\n   ============================================================ */\n\n:root {\n  /* --- Spacing scale (4px base) -------------------------------- */\n  --space-0: 0;\n  --space-1: 0.25rem;   /* 4  */\n  --space-2: 0.5rem;    /* 8  */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.5rem;    /* 24 */\n  --space-6: 2rem;      /* 32 */\n  --space-7: 2.5rem;    /* 40 */\n  --space-8: 3rem;      /* 48 */\n  --space-9: 4rem;      /* 64 */\n  --space-10: 5rem;     /* 80 */\n  --space-12: 7.5rem;   /* 120 */\n\n  /* --- Radii ---------------------------------------------------- */\n  --radius-xs: 4px;\n  --radius-sm: 6px;\n  --radius-md: 10px;\n  --radius-lg: 16px;\n  --radius-xl: 24px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* --- Borders -------------------------------------------------- */\n  --border-width: 1px;          /* @kind other */\n  --border-width-strong: 2px;   /* @kind other */\n\n  /* --- Elevation (product UI only \u2014 never on brand shapes) ------ */\n  --shadow-none: none;\n  --shadow-sm: 0 1px 2px rgba(20, 25, 26, 0.06),\n               0 1px 1px rgba(20, 25, 26, 0.04);\n  --shadow-md: 0 4px 12px rgba(20, 25, 26, 0.08),\n               0 2px 4px rgba(20, 25, 26, 0.05);\n  --shadow-lg: 0 12px 32px rgba(20, 25, 26, 0.12),\n               0 4px 10px rgba(20, 25, 26, 0.06);\n  --shadow-focus: 0 0 0 3px color-mix(in srgb, var(--ask-petrol) 35%, transparent);\n\n  /* --- Motion --------------------------------------------------- */\n  --ease-standard: cubic-bezier(0.2, 0, 0.1, 1);   /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);       /* @kind other */\n  --dur-fast: 120ms;   /* @kind other */\n  --dur-base: 200ms;   /* @kind other */\n  --dur-slow: 320ms;   /* @kind other */\n\n  /* --- Brand graphic motif ------------------------------------- */\n  --stoerer-tilt: -7deg;        /* @kind other */\n}\n</style>\n  <style>/* ============================================================\n   ASKLEPIOS \u2014 BASE / FOUNDATION\n   Element defaults that apply the Hausschrift and brand colours.\n   ============================================================ */\n\n:root {\n  color-scheme: light;\n}\n\nbody {\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-normal);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Headings \u2014 Inter Bold, tight tracking, left aligned */\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  color: var(--text-strong);\n  letter-spacing: var(--ls-tight);\n  line-height: var(--lh-tight);\n  margin: 0;\n  text-wrap: balance;\n}\nh1 { font-size: var(--fs-h1); }\nh2 { font-size: var(--fs-h2); }\nh3 { font-size: var(--fs-h3); letter-spacing: var(--ls-snug); }\nh4 { font-size: var(--fs-h4); letter-spacing: var(--ls-snug); }\n\np { margin: 0; text-wrap: pretty; }\n\na {\n  color: var(--color-link);\n  text-underline-offset: 2px;\n  text-decoration-thickness: 1px;\n}\na:visited { color: var(--color-link-visited); }\n\n/* Numerals can be set tabular & right-aligned per brand guidance */\n.ask-num {\n  font-variant-numeric: tabular-nums;\n  text-align: right;\n}\n\n::selection {\n  background: color-mix(in srgb, var(--ask-petrol) 22%, #fff);\n  color: var(--ask-petrol-800);\n}\n</style>\n  <style>/* ============================================================\n   ASKLEPIOS DESIGN SYSTEM \u2014 global entry point\n   Consumers link THIS file. It only @imports the token layers.\n   ============================================================ */\n\n/* ============================================================\n   ASKLEPIOS \u2014 FONTS\n   Hausschrift: \"Inter\" (Regular + Bold), the official Asklepios\n   brand typeface. Loaded here from Google Fonts.\n   ============================================================ */\n\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b49d0774-e002-47ba-abc3-d2daae226bb8\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"2b684907-40b9-45c6-bdb9-d59389709c59\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"2aca257d-29a6-4f49-88f8-6d94aa9a0cfd\") format('woff2');\n  unicode-range: U+1F00-1FFF;\n}\n/* greek */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e4299e31-4c43-4d77-88ae-91f632a0ddd7\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font- 9, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Inter is the genuine Asklepios house font \u2014 not a substitution.\n   If you self-host the licensed binaries, drop them in assets/fonts/\n   and replace the @import above with @font-face rules pointing there. */\n\n/* ============================================================\n   ASKLEPIOS \u2014 COLOR TOKENS\n   Source: Asklepios Corporate Design / PowerPoint-Vorlage 2025\n   Color scheme name in theme: \"ASKLEPIOS\"\n   ============================================================ */\n\n:root {\n  /* --- Brand core ------------------------------------------------ */\n  --ask-petrol: #007377;          /* Prim\u00e4rfarbe  \u00b7 RGB 0 115 119  */\n  --ask-magenta: #bb16a3;         /* Sekund\u00e4rfarbe \u00b7 RGB 187 22 163 */\n\n  /* --- Accent row (Designfarben) -------------------------------- */\n  --ask-navy: #254a5d;            /* dunkles Petrol \u00b7 RGB 37 74 93  */\n  --ask-violet: #6558b1;          /* RGB 101 88 177 */\n  --ask-pink: #ff417d;            /* RGB 255 65 125 */\n  --ask-mint: #64eb9b;            /* RGB 100 235 155 */\n  --ask-gold: #ffb81c;            /* RGB 255 184 28  */\n  --ask-link-visited: #56b093;    /* besuchter Link */\n\n  /* --- Neutrals -------------------------------------------------- */\n  --ask-black: #000000;\n  --ask-white: #ffffff;\n  --ask-ink: #14191a;             /* near-black text on light       */\n  --ask-grey-900: #1f2a2b;\n  --ask-grey-700: #46595b;\n  --ask-grey-500: #7a8d8e;\n  --ask-grey-300: #c3cfd0;\n  --ask-grey-200: #dde5e5;\n  --ask-grey-100: #eef2f2;\n  --ask-grey-050: #f6f8f8;\n\n  /* --- Tints (75 / 50 / 25 % colour strength over white) --------\n     Mirrors the 75/50/25 % swatch ladder in the corporate palette. */\n  --ask-petrol-75: color-mix(in srgb, var(--ask-petrol) 75%, #fff);\n  --ask-petrol-50: color-mix(in srgb, var(--ask-petrol) 50%, #fff);\n  --ask-petrol-25: color-mix(in srgb, var(--ask-petrol) 25%, #fff);\n\n  --ask-magenta-75: color-mix(in srgb, var(--ask-magenta) 75%, #fff);\n  --ask-magenta-50: color-mix(in srgb, var(--ask-magenta) 50%, #fff);\n  --ask-magenta-25: color-mix(in srgb, var(--ask-magenta) 25%, #fff);\n\n  --ask-navy-75: color-mix(in srgb, var(--ask-navy) 75%, #fff);\n  --ask-navy-50: color-mix(in srgb, var(--ask-navy) 50%, #fff);\n  --ask-navy-25: color-mix(in srgb, var(--ask-navy) 25%, #fff);\n\n  --ask-violet-50: color-mix(in srgb, var(--ask-violet) 50%, #fff);\n  --ask-pink-50: color-mix(in srgb, var(--ask-pink) 50%, #fff);\n  --ask-mint-50: color-mix(in srgb, var(--ask-mint) 50%, #fff);\n  --ask-gold-50: color-mix(in srgb, var(--ask-gold) 50%, #fff);\n\n  /* Petrol shade used for hover / pressed (darker, toward navy) */\n  --ask-petrol-700: #005a5d;\n  --ask-petrol-800: #00484b;\n  --ask-magenta-700: #9a1187;\n\n  /* ============================================================\n     SEMANTIC ALIASES \u2014 reference these in product UI\n     ============================================================ */\n\n  /* Brand */\n  --color-brand: var(--ask-petrol);\n  --color-brand-secondary: var(--ask-magenta);\n  --color-accent: var(--ask-magenta);\n\n  /* Surfaces */\n  --surface-page: var(--ask-white);\n  --surface-card: var(--ask-white);\n  --surface-muted: var(--ask-grey-050);\n  --surface-sunken: var(--ask-grey-100);\n  --surface-inverse: var(--ask-petrol);     /* dark / brand sections */\n  --surface-inverse-deep: var(--ask-navy);\n\n  /* Text */\n  --text-strong: var(--ask-ink);\n  --text-body: var(--ask-grey-900);\n  --text-muted: var(--ask-grey-700);\n  --text-subtle: var(--ask-grey-500);\n  --text-brand: var(--ask-petrol);\n  --text-on-brand: var(--ask-white);\n  --text-on-dark: var(--ask-white);\n\n  /* Lines & borders */\n  --border-subtle: var(--ask-grey-200);\n  --border-default: var(--ask-grey-300);\n  --border-strong: var(--ask-petrol);\n\n  /* Interactive */\n  --color-link: var(--ask-petrol);\n  --color-link-visited: var(--ask-link-visited);\n  --focus-ring: var(--ask-petrol);\n\n  /* Status (built from the brand accent row) */\n  --status-success: #1f8a5b;\n  --status-success-surface: #e4f6ec;\n  --status-warning: var(--ask-gold);\n  --status-warning-surface: #fff4d9;\n  --status-danger: var(--ask-pink);\n  --status-danger-surface: #ffe4ec;\n  --status-info: var(--ask-petrol);\n  --status-info-surface: #e0f0f0;\n}\n\n/* ============================================================\n   ASKLEPIOS \u2014 TYPOGRAPHY TOKENS\n   Hausschrift \"Inter\". Body copy is left-aligned; numbers may be\n   right-aligned; short boxed labels may be centred.\n   ============================================================ */\n\n:root {\n  /* --- Families ------------------------------------------------- */\n  --font-sans: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;\n  --font-display: 'Inter', -apple-system, 'Segoe UI', sans-serif;\n  --font-mono: ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace;\n\n  /* --- Weights --------------------------------------------------\n     @kind font */\n  --fw-regular: 400;   /* @kind font */\n  --fw-medium: 500;    /* @kind font */\n  --fw-semibold: 600;  /* @kind font */\n  --fw-bold: 700;      /* @kind font */\n  --fw-extrabold: 800; /* @kind font */\n\n  /* --- Type scale (rem, 16px base) -----------------------------\n     Maps to the PowerPoint Textebenen (text levels) + display use. */\n  --fs-display: 4.5rem;     /* 72 \u2014 slide title / hero            */\n  --fs-h1: 3rem;            /* 48 \u2014 page H1                       */\n  --fs-h2: 2.25rem;         /* 36 \u2014 section heading               */\n  --fs-h3: 1.625rem;        /* 26 \u2014 subsection (Ebene 1)          */\n  --fs-h4: 1.25rem;         /* 20 \u2014 card title (Ebene 2)          */\n  --fs-lg: 1.125rem;        /* 18 \u2014 lead body                     */\n  --fs-body: 1rem;          /* 16 \u2014 body                          */\n  --fs-sm: 0.875rem;        /* 14 \u2014 secondary                     */\n  --fs-xs: 0.75rem;         /* 12 \u2014 caption / footer              */\n\n  /* --- Line heights --------------------------------------------\n     @kind other */\n  --lh-tight: 1.1;     /* @kind other */\n  --lh-snug: 1.25;     /* @kind other */\n  --lh-normal: 1.5;    /* @kind other */\n  --lh-relaxed: 1.65;  /* @kind other */\n\n  /* --- Letter spacing ------------------------------------------\n     @kind other */\n  --ls-tight: -0.02em; /* @kind other */\n  --ls-snug: -0.01em;  /* @kind other */\n  --ls-normal: 0;      /* @kind other */\n  --ls-wide: 0.04em;   /* @kind other */\n  --ls-caps: 0.08em;   /* @kind other */\n\n  /* --- Semantic aliases ---------------------------------------- */\n  --text-display-weight: var(--fw-bold);\n  --text-heading-weight: var(--fw-bold);\n  --text-body-weight: var(--fw-regular);\n}\n\n/* ============================================================\n   ASKLEPIOS \u2014 SPACING, RADII, ELEVATION, MOTION\n   Brand rule: graphic shapes (St\u00f6rer / Hinweisk\u00e4sten) carry NO\n   shadow. Shadows below are reserved for product UI surfaces only.\n   ============================================================ */\n\n:root {\n  /* --- Spacing scale (4px base) -------------------------------- */\n  --space-0: 0;\n  --space-1: 0.25rem;   /* 4  */\n  --space-2: 0.5rem;    /* 8  */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.5rem;    /* 24 */\n  --space-6: 2rem;      /* 32 */\n  --space-7: 2.5rem;    /* 40 */\n  --space-8: 3rem;      /* 48 */\n  --space-9: 4rem;      /* 64 */\n  --space-10: 5rem;     /* 80 */\n  --space-12: 7.5rem;   /* 120 */\n\n  /* --- Radii ---------------------------------------------------- */\n  --radius-xs: 4px;\n  --radius-sm: 6px;\n  --radius-md: 10px;\n  --radius-lg: 16px;\n  --radius-xl: 24px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* --- Borders -------------------------------------------------- */\n  --border-width: 1px;          /* @kind other */\n  --border-width-strong: 2px;   /* @kind other */\n\n  /* --- Elevation (product UI only \u2014 never on brand shapes) ------ */\n  --shadow-none: none;\n  --shadow-sm: 0 1px 2px rgba(20, 25, 26, 0.06),\n               0 1px 1px rgba(20, 25, 26, 0.04);\n  --shadow-md: 0 4px 12px rgba(20, 25, 26, 0.08),\n               0 2px 4px rgba(20, 25, 26, 0.05);\n  --shadow-lg: 0 12px 32px rgba(20, 25, 26, 0.12),\n               0 4px 10px rgba(20, 25, 26, 0.06);\n  --shadow-focus: 0 0 0 3px color-mix(in srgb, var(--ask-petrol) 35%, transparent);\n\n  /* --- Motion --------------------------------------------------- */\n  --ease-standard: cubic-bezier(0.2, 0, 0.1, 1);   /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);       /* @kind other */\n  --dur-fast: 120ms;   /* @kind other */\n  --dur-base: 200ms;   /* @kind other */\n  --dur-slow: 320ms;   /* @kind other */\n\n  /* --- Brand graphic motif ------------------------------------- */\n  --stoerer-tilt: -7deg;        /* @kind other */\n}\n\n/* ============================================================\n   ASKLEPIOS \u2014 BASE / FOUNDATION\n   Element defaults that apply the Hausschrift and brand colours.\n   ============================================================ */\n\n:root {\n  color-scheme: light;\n}\n\nbody {\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-normal);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Headings \u2014 Inter Bold, tight tracking, left aligned */\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  color: var(--text-strong);\n  letter-spacing: var(--ls-tight);\n  line-height: var(--lh-tight);\n  margin: 0;\n  text-wrap: balance;\n}\nh1 { font-size: var(--fs-h1); }\nh2 { font-size: var(--fs-h2); }\nh3 { font-size: var(--fs-h3); letter-spacing: v a >>> 15, 1 | a);\n      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;\n      return ((t ^ t >>> 14) >>> 0) / 4294967296;\n    };\n  }\n  // style a tile by role \u2192 size hierarchy; NO clamp/fixed height so nothing is ever cut off\n  styleCard(v, role){\n    const S = { big:{ b:154, t:21, s:19, sum:true }, mid:{ b:116, t:17, s:16, sum:true }, stack:{ b:76, t:15, s:15, sum:false } }[role];\n    return {\n      ...v,\n      cardStyle: 'flex:1 1 auto;display:flex;flex-direction:column;overflow:hidden;background:#fff;border:1px solid #dde5e5;border-radius:13px;text-decoration:none;color:inherit;',\n      thumbStyle: 'flex:none;display:flex;flex-direction:column;justify-content:space-between;height:' + S.b + 'px;padding:' + (role === 'stack' ? '12px 14px' : '14px') + ';background:' + v.catColor + ';',\n      thumbSrcStyle: 'font-size:' + S.s + 'px;font-weight:800;letter-spacing:-.2px;color:#ffffff;',\n      titleStyle: 'margin:0;font-size:' + S.t + 'px;line-height:1.3;font-weight:700;color:#14191a;letter-spacing:-.2px;',\n      showSummary: S.sum,\n    };\n  }\n  buildRows(items){\n    const rand = this.mulberry(20260618);   // fixed seed \u2192 deterministic, stable on re-render\n    const R = (lo, hi) => lo + rand() * (hi - lo);\n    // shapes keyed by their tile-count silhouette; a shape may not recur within the last two rows\n    const mid = (w) => ({ w, tiles: [ 'mid' ] });\n    const big = (w) => ({ w, tiles: [ 'big' ] });\n    const st  = () => ({ w: 1, tiles: [ 'stack', 'stack' ] });\n    const lone = () => (rand() < 0.5 ? big(R(1.35, 1.95)) : mid(R(1.15, 1.65)));\n    const S = {\n      t:  () => [ mid(R(0.78, 1.45)), mid(R(0.78, 1.45)), mid(1) ],   // 1:1:1\n      sL: () => [ st(), lone() ],                                     // 2:1 (stack left)\n      sR: () => [ lone(), st() ],                                     // 1:2 (stack right)\n      d:  () => (rand() < 0.5 ? [ big(R(1.1, 1.7)), mid(1) ] : [ mid(R(0.8, 1.3)), big(1) ]),  // 1:1\n    };\n    const keys = [ 't', 'sL', 'sR', 'd' ];\n    const rows = []; let i = 0; const recent = [];\n    while (i < items.length){\n      const rem = items.length - i;\n      let key, cells;\n      if (rem === 1){ key = 'b'; cells = [ big(1) ]; }\n      else if (rem === 2){ key = 'd'; cells = S.d(); }\n      else {\n        let avail = keys.filter(k => !recent.includes(k));\n        if (!avail.length) avail = keys;\n        key = avail[Math.floor(rand() * avail.length)];\n        cells = S[key]();\n      }\n      let k = i;\n      const outCells = cells.map(cell => ({\n        wrapStyle: 'flex:' + cell.w.toFixed(3) + ' 1 0;min-width:0;display:flex;flex-direction:column;gap:18px;',\n        items: cell.tiles.map(role => this.styleCard(items[k++], role)),\n      }));\n      i = k;\n      rows.push({ style: 'display:flex;gap:18px;align-items:stretch;', cells: outCells });\n      recent.push(key); if (recent.length > 2) recent.shift();\n    }\n    return rows;\n  }\n\n  // ---- chip / row styles ----\n  chipStyle(active, color){\n    const base = 'display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;border:1px solid ';\n    return active\n      ? base + (color||'#007377') + ';background:' + (color||'#007377') + ';color:#fff;'\n      : base + '#dde5e5;background:#fff;color:#46595b;';\n  }\n  chipDot(active, color){\n    const c = active ? '#ffffff' : (color || '#007377');\n    return 'display:inline-block;width:8px;height:8px;border-radius:3px;background:' + c + ';';\n  }\n  chipCount(active){\n    return 'font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;background:' + (active ? 'rgba(255,255,255,.22)' : '#eef2f2') + ';color:' + (active ? '#fff' : '#7a8d8e') + ';';\n  }\n  rowStyle(active){\n    const base = 'display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:none;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;background:';\n    return active ? base + '#e0f0f0;color:#005a5d;' : base + 'transparent;color:#46595b;';\n  }\n  rowDot(color){ return 'display:inline-block;width:9px;height:9px;border-radius:3px;background:' + color + ';flex:none;'; }\n  rowCount(active){ return 'font-size:11px;font-weight:700;color:' + (active ? '#007377' : '#a9b8b9') + ';'; }\n  segStyle(active){\n    const base = 'border:none;border-radius:8px;padding:0 13px;height:32px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;background:';\n    return active ? base + '#007377;color:#fff;' : base + 'transparent;color:#46595b;';\n  }\n\n  // ---- live fetch (best effort, user-initiated) ----\n  async tryLive(){\n    if (this.state.liveBusy) return;\n    this.setState({ liveBusy: true });\n    try {\n      const q = 'https://news.google.com/rss/search?q=Asklepios%20OR%20UKE%20Krankenhaus%20Hamburg&hl=de&gl=DE&ceid=DE:de';\n      const url = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(q);\n      const ctrl = new AbortController();\n      const to = setTimeout(()=>ctrl.abort(), 8000);\n      const res = await fetch(url, { signal: ctrl.signal });\n      clearTimeout(to);\n      const txt = await res.text();\n      const xml = new DOMParser().parseFromString(txt, 'text/xml');\n      const nodes = Array.from(xml.querySelectorAll('item')).slice(0, 6);\n      const fresh = nodes.map((el, i) => {\n        const t = (el.querySelector('title')||{}).textContent || 'Ohne Titel';\n        const link = (el.querySelector('link')||{}).textContent || '#';\n        const pub = (el.querySelector('pubDate')||{}).textContent;\n        const src = (el.querySelector('source')||{}).textContent || 'Google News';\n        const desc = ((el.querySelector('description')||{}).textContent || '').replace(/<[^>]+>/g,'').trim().slice(0, 160);\n        return { id:'live'+i, feed:'radar', source:src, category:'Wettbewerber', competitor:'Live-Feed', relevance:'Mittel',\n          title:t, summary: desc || 'Live aus dem RSS-Feed abgerufen.', url:link, dateMs: pub ? Date.parse(pub) : Date.now() };\n      }).filter(x => !isNaN(x.dateMs));\n      if (fresh.length){\n        this.setState(s => ({ items: fresh.concat(s.items), liveStatus:'live', liveBusy:false, syncAgo:0, newCount: s.newCount + fresh.length }));\n      } else {\n        this.setState({ liveStatus:'demo', liveBusy:false });\n      }\n    } catch(e){\n      this.setState({ liveStatus:'error', liveBusy:false });\n    }\n  }\n\n  renderVals(){\n    const s = this.state;\n    const all = s.items;\n    const filtered = this.sortItems(all.filter(it => this.matches(it)));\n    const viewItems = filtered.map(it => this.view(it));\n\n    // feed chips\n    const countFeed = k => all.filter(it => it.feed === k).length;\n    const feedChips = [\n      { key:null, label:'Alle Quellen', color:'#007377', count: all.length },\n      { key:'briefing', label:this.FEEDS.briefing.label, color:this.FEEDS.briefing.color, count:countFeed('briefing') },\n      { key:'stellen', label:this.FEEDS.stellen.label, color:this.FEEDS.stellen.color, count:countFeed('stellen') },\n      { key:'radar', label:this.FEEDS.radar.label, color:this.FEEDS.radar.color, count:countFeed('radar') },\n    ].map(c => {\n      const active = s.activeFeed === c.key;\n      return { label:c.label, count:c.count, style:this.chipStyle(active, c.color),\n        dotStyle:this.chipDot(active, c.color), countStyle:this.chipCount(active),\n        toggle: () => this.setState({ activeFeed: active ? null : c.key }) };\n    });\n\n    // sidebar source rows (3 feeds)\n    const sourceRows = ['briefing','stellen','radar'].map(k => {\n      const f = this.FEEDS[k]; const active = s.activeFeed === k;\n      return { label:f.label, count:countFeed(k), color:f.color, style:this.rowStyle(active),\n        dotStyle:this.rowDot(f.color), countStyle:this.rowCount(active),\n        select: () => this.setState({ activeFeed: active ? null : k }) };\n    });\n\n    // sidebar category rows\n    const catCounts = {};\n    all.forEach(it => { catCounts[it.category] = (catCounts[it.category]||0) + 1; });\n    const catRows = Object.keys(catCounts)\n      .sort((a,b)=> catCounts[b] - catCounts[a])\n      .map(cat => {\n        const active = s.activeCat === cat; const color = this.CATS[cat] || '#7a8d8e';\n        return { label:cat, count:catCounts[cat], color:color, style:this.rowStyle(active),\n          dotStyle:this.rowDot(color), countStyle:this.rowCount(active),\n          select: () => this.setState({ activeCat: active ? null : cat }) };\n      });\n\n    // layouts\n    const layout = s.layout;\n    const isMagazin = layout === 'magazin', isColumns = layout === 'columns', isCompact = layout === 'compact';\n    const hasResults = viewItems.length > 0;\n\n    const heroItem = hasResults ? viewItems[0] : null;\n    const gridItems = hasResults ? viewItems.slice(1) : [];\n    const magRows = this.buildRows(gridItems);\n\n    const columns = ['briefing','stellen','radar'].map(k => {\n      const items = viewItems.filter((_, i) => filtered[i].feed === k);\n      return { label:this.FEEDS[k].label, color:this.FEEDS[k].color, count:items.length, items:items, empty: items.length === 0 };\n    });\n\n    const groupsMap = {};\n    viewItems.forEach((v, i) => {\n      const key = this.dayLabel(filtered[i].dateMs);\n      (groupsMap[key] = groupsMap[key] || []).push(v);\n    });\n    const order = Object.keys(groupsMap);\n    const dayGroups = order.map(k => ({ label:k, count:groupsMap[k].length, items:groupsMap[k] }));\n\n    // sort label\n    const sortLabels = { 'feed':'Quelle (Standard)', 'neueste':'Neueste zuerst', '\u00e4lteste':'\u00c4lteste zuerst', 'relevanz':'Nach Relevanz' };\n    const sortOrder = ['feed','neueste','\u00e4lteste','relevanz'];\n\n    // auto toggle\n    const ar = s.autoRefresh;\n    const autoTrackStyle = 'display:inline-block;position:relative;width:36px;height:21px;border-radius:20px;transition:background .2s;background:' + (ar ? '#007377' : '#c3cfd0') + ';';\n    const autoKnobStyle = 'position:absolute;top:2px;left:' + (ar ? '17px' : '2px') + ';width:17px;height:17px;border-radius:50%;background:#fff;transition:left .2s;';\n\n    // live status\n    const liveMap = {\n      demo:  { label:'Demodaten', color:'#b07a00', dot:'#ffb81c' },\n      live:  { label:'Live verbunden', color:'#1f8a5b', dot:'#1f8a5b' },\n      error: { label:'Live nicht erreichbar', color:'#d4326a', dot:'#ff417d' },\n    };\n    const lv = liveMap[s.liveStatus] || liveMap.demo;\n    const liveDotStyle = 'display:inline-block;width:8px;height:8px;border-radius:50%;background:' + lv.dot + ';';\n    const liveNote = s.liveStatus === 'live'\n      ? 'Live-Daten aus Google News RSS wurden erg\u00e4nzt.'\n      : s.liveStatus === 'error'\n        ? 'Direkter RSS-Abruf im Browser ist durch CORS blockiert. Es werden die Demodaten der Reports angezeigt.'\n        : 'Aktuell aus den Report-Daten gespeist. RSS live \u00fcber einen Proxy nachladen (Best-Effort).';\n\n    // view title\n    let viewTitle = 'Alle Meldungen';\n    if (s.query.trim()) viewTitle = 'Suche: \u201e' + s.query.trim() + '\u201c';\n    else if (s.activeFeed) viewTitle = this.FEEDS[s.activeFeed].label;\n    else if (s.activeCat) viewTitle = s.activeCat;\n\n    // sync label\n    const ago = s.syncAgo;\n    const lastSyncLabel = ago === 0 ? 'Soeben aktualisiert'\n      : ago < 60 ? 'Aktualisiert vor ' + ago + ' Sek.'\n      : 'Aktualisiert vor ' + Math.floor(ago/60) + ' Min.';\n\n    const todayCount = all.filter(it => this.dayLabel(it.dateMs) === 'Heute').length;\n\n    return {\n      // search\n      query: s.query,\n      onSearch: (e) => this.setState({ query: e.target.value }),\n      // layout switch\n      isMagazin, isColumns, isCompact,\n      showMagazin: isMagazin && hasResults, showColumns: isColumns && hasResults, showCompact: isCompact && hasResults,\n      noResults: !hasResults,\n      magBtnStyle: this.segStyle(isMagazin), colBtnStyle: this.segStyle(isColumns), cmpBtnStyle: this.segStyle(isCompact),\n      setMag: () => this.setState({ layout:'magazin' }),\n      setCol: () => this.setState({ layout:'columns' }),\n      setCmp: () => this.setState({ layout:'compact' }),\n      // auto + refresh\n      autoTrackStyle, autoKnobStyle,\n      toggleAuto: () => this.setState(st => ({ autoRefresh: !st.autoRefresh })),\n      refreshNow: () => this.setState({ syncAgo: 0, newCount: 0 }),\n      spinStyle: 'display:inline-flex;' + (s.liveBusy ? 'animation:nmspin .8s linear infinite;' : ''),\n      // subbar\n      feedChips, activeRegion: s.activeRegion, onRegion: (e) => { const r = e.target.value; this.setState({ activeRegion: r }); if (typeof localStorage !== 'undefined') localStorage.setItem('newsroom_region', r); }, cycleSort: () => this.setState(st => ({ sort: sortOrder[(sortOrder.indexOf(st.sort)+1) % sortOrder.length] })),\n      sortLabel: sortLabels[s.sort],\n      liveLabel: lv.label, liveColor: lv.color, liveDotStyle,\n      // sidebar\n      sourceRows, catRows, totalCount: all.length, todayCount,\n      tryLive: () => this.tryLive(), liveBusy: s.liveBusy, liveNote,\n      liveBtnLabel: s.liveBusy ? 'L\u00e4dt \u2026' : 'RSS live nachladen',\n      // main header\n      viewTitle, resultCount: viewItems.length,\n      showNew: s.newCount > 0, newLabel: s.newCount + (s.newCount === 1 ? ' neue Meldung' : ' neue Meldungen'),\n      lastSyncLabel,\n      resetFilters: () => { this.setState({ query:'', activeFeed:null, activeCat:null, activeRegion:'hamburg' }); if (typeof localStorage !== 'undefined') localStorage.setItem('newsroom_region', 'hamburg'); },\n      // content\n      heroItem, magRows, hasGrid: gridItems.length > 0,\n      columns, dayGroups, hasResults,\n    };\n  }\n}\n<\/script>\n\n\n</body></html>"
